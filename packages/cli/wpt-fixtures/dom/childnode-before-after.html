<!DOCTYPE html>
<meta charset="utf-8">
<title>DOM ChildNode before and after</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  .made {
    width: 43px;
    height: 29px;
    background-color: rgb(1, 2, 3);
  }
</style>
<body>
<section id="before-host"><span id="before-left">L</span><span id="before-target">T</span><span id="before-right">R</span></section>
<section id="after-host"><span id="after-left">L</span><span id="after-target">T</span><span id="after-right">R</span></section>
<section id="move-old"><b id="moved">X</b></section>
<section id="move-new"><span id="move-target">T</span><span id="move-tail">R</span></section>
<section id="style-host"><span id="style-target">T</span></section>
<script>
test(function () {
  var host = document.getElementById("before-host");
  var target = document.getElementById("before-target");
  var node = document.createElement("i");
  node.id = "before-node";
  node.textContent = "N";

  target.before("A", node, "B");

  assert_equals(host.textContent, "LANBTR", "before inserts arguments before the receiver in order");
  assert_equals(host.children[1], node, "element argument lands before the receiver");
  assert_equals(target.previousElementSibling, node, "receiver previousElementSibling updates");
  assert_equals(document.getElementById("before-node"), node, "inserted node is queryable");
}, "Element.before inserts string and node arguments before the receiver");

test(function () {
  var host = document.getElementById("after-host");
  var target = document.getElementById("after-target");
  var node = document.createElement("i");
  node.id = "after-node";
  node.textContent = "N";

  target.after("A", node, "B");

  assert_equals(host.textContent, "LTANBR", "after inserts arguments after the receiver in order");
  assert_equals(host.children[2], node, "element argument lands after the receiver");
  assert_equals(target.nextElementSibling, node, "receiver nextElementSibling updates");
  assert_equals(document.getElementById("after-node"), node, "inserted node is queryable");
}, "Element.after inserts string and node arguments after the receiver");

test(function () {
  var oldParent = document.getElementById("move-old");
  var newParent = document.getElementById("move-new");
  var target = document.getElementById("move-target");
  var moved = document.getElementById("moved");

  target.after(moved, "Q");

  assert_equals(oldParent.textContent, "", "old parent loses the moved node");
  assert_equals(newParent.textContent, "TXQR", "reparented node and string land after the receiver");
  assert_equals(moved.parentElement, newParent, "moved node parent is updated");
  assert_equals(newParent.querySelector("#moved"), moved, "fresh scoped query observes the moved node");
}, "Element.after reparents existing connected nodes without stale copies");

test(function () {
  var detached = document.createElement("p");

  detached.before("ignored");
  detached.after("ignored");

  assert_equals(detached.textContent, "", "detached nodes remain unchanged");
  assert_equals(document.querySelector("p"), null, "detached receiver does not enter the document");
}, "Element.before and Element.after are no-ops for detached receivers");

test(function () {
  var host = document.getElementById("style-host");
  var target = document.getElementById("style-target");
  var made = document.createElement("article");
  made.id = "styled-before";
  made.className = "made";
  made.textContent = "styled";

  target.before(made);

  assert_equals(host.querySelector("#styled-before.made"), made, "selector matching observes inserted content");
  assert_equals(host.textContent, "styledT", "textContent observes inserted node");
  assert_equals(getComputedStyle(made).getPropertyValue("width"), "43px", "computed width applies after before()");
  assert_equals(getComputedStyle(made).getPropertyValue("height"), "29px", "computed height applies after before()");
  assert_equals(getComputedStyle(made).getPropertyValue("background-color"), "rgb(1, 2, 3)", "paint style applies after before()");
}, "Element.before content participates in selector matching and computed style");
</script>
</body>
