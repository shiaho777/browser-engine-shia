<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic style element removal</title>
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
</head>
<body>
<div id="removal-target">dynamic style removal</div>
<script>
test(function () {
  var sheet = document.createElement("style");
  sheet.textContent = "#removal-target { width: 44px; color: red; background-color: blue; }";
  document.querySelector("head").appendChild(sheet);

  var cs = getComputedStyle(document.getElementById("removal-target"));
  assert_equals(cs.getPropertyValue("width"), "44px", "inserted style controls width");
  assert_equals(cs.getPropertyValue("color"), "rgb(255, 0, 0)", "inserted style controls color");
  assert_equals(cs.getPropertyValue("background-color"), "rgb(0, 0, 255)", "inserted style controls background");

  sheet.remove();

  cs = getComputedStyle(document.getElementById("removal-target"));
  assert_equals(cs.getPropertyValue("width"), "auto", "removed style no longer controls width");
  assert_equals(cs.getPropertyValue("color"), "rgb(0, 0, 0)", "removed style no longer controls color");
  assert_equals(cs.getPropertyValue("background-color"), "rgba(0, 0, 0, 0)", "removed style no longer controls background");
}, "removing a dynamically inserted style element removes its cascade rules");

test(function () {
  var head = document.querySelector("head");
  var sheet = document.createElement("style");
  sheet.appendChild(document.createTextNode("#remove-child-target { width: 52px; color: #0080ff; }"));
  head.appendChild(sheet);

  var target = document.createElement("div");
  target.id = "remove-child-target";
  document.querySelector("body").appendChild(target);
  assert_equals(getComputedStyle(target).getPropertyValue("width"), "52px", "style applies before removeChild");

  var removed = head.removeChild(sheet);
  assert_equals(removed, sheet, "removeChild returns the removed style node");
  assert_equals(getComputedStyle(target).getPropertyValue("width"), "auto", "removeChild drops the style rule");
  assert_equals(getComputedStyle(target).getPropertyValue("color"), "rgb(0, 0, 0)", "removeChild drops the color rule");
}, "head.removeChild(style) removes dynamically inserted style rules");
</script>
</body>
</html>
