<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS selector matching through cascade</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  #scope .item { color: red; }
  #scope > .direct { background-color: blue; }
  [data-role="main"] { width: 33px; }
  li:first-child { height: 11px; }
</style>
<body>
  <section id="scope">
    <div id="direct" class="direct item" data-role="main">direct</div>
    <div><span id="nested" class="item">nested</span></div>
    <ul><li id="first">one</li><li id="second">two</li></ul>
  </section>
<script>
test(function () {
  assert_equals(getComputedStyle(document.getElementById("nested")).getPropertyValue("color"), "rgb(255, 0, 0)", "descendant selector matched nested item");
}, "descendant selector drives computed style");

test(function () {
  assert_equals(getComputedStyle(document.getElementById("direct")).getPropertyValue("background-color"), "rgb(0, 0, 255)", "child selector matched direct child");
  assert_equals(getComputedStyle(document.getElementById("nested")).getPropertyValue("background-color"), "rgba(0, 0, 0, 0)", "child selector did not match deeper descendant");
}, "child selector is direct-child scoped");

test(function () {
  assert_equals(getComputedStyle(document.getElementById("direct")).getPropertyValue("width"), "33px", "attribute selector matched");
  assert_equals(getComputedStyle(document.getElementById("first")).getPropertyValue("height"), "11px", "first-child matched first li");
  assert_equals(getComputedStyle(document.getElementById("second")).getPropertyValue("height"), "auto", "first-child did not match second li");
}, "attribute and structural pseudo-class selectors drive computed style");
</script>
</body>
