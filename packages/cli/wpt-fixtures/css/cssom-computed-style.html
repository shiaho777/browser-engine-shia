<!DOCTYPE html>
<meta charset="utf-8">
<title>CSSOM getComputedStyle resolved values</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  #target {
    color: red;
    width: 40px;
    font-size: 20px;
  }
</style>
<body>
<div id="target">style</div>
<script>
test(function () {
  var cs = getComputedStyle(document.getElementById("target"));
  assert_equals(cs.getPropertyValue("color"), "rgb(255, 0, 0)", "color serializes as an rgb() string");
  assert_equals(cs.color, "rgb(255, 0, 0)", "camelCase property access exposes the same resolved value");
}, "getComputedStyle exposes resolved color through CSSOM accessors");

test(function () {
  var cs = getComputedStyle(document.getElementById("target"));
  assert_equals(cs.getPropertyValue("width"), "40px", "specified width resolves with a px unit");
  assert_equals(cs.getPropertyValue("font-size"), "20px", "specified font-size resolves with a px unit");
}, "getComputedStyle exposes resolved length values");

test(function () {
  var cs = getComputedStyle(document.getElementById("target"));
  assert_equals(cs.getPropertyValue("height"), "auto", "unset height resolves to the cascade initial value");
  assert_equals(cs.getPropertyValue("unknown-property"), "", "unknown CSS property returns an empty string");
}, "getComputedStyle exposes initial values and empty unknown properties");
</script>
</body>
