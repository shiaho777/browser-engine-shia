<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS cascade specificity and source order</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
  div { color: red; }
  .box { color: green; }
  #target { color: blue; }
  .tie { background-color: red; }
  .tie { background-color: #00ff00; }
  .important-low { color: red !important; }
  #important-target { color: blue; }
</style>
<body>
  <div id="target" class="box tie">specificity</div>
  <p id="important-target" class="important-low">important</p>
<script>
test(function () {
  var cs = getComputedStyle(document.getElementById("target"));
  assert_equals(cs.getPropertyValue("color"), "rgb(0, 0, 255)", "id specificity wins over class and type");
}, "specificity chooses the highest-weight selector");

test(function () {
  var cs = getComputedStyle(document.getElementById("target"));
  assert_equals(cs.getPropertyValue("background-color"), "rgb(0, 255, 0)", "later same-specificity rule wins");
}, "source order breaks equal-specificity ties");

test(function () {
  var cs = getComputedStyle(document.getElementById("important-target"));
  assert_equals(cs.getPropertyValue("color"), "rgb(255, 0, 0)", "important beats higher specificity");
}, "!important participates in cascade ordering");
</script>
</body>
